<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio - Visitas ITR</title>
  <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">

  <link rel="stylesheet" href="../css/style.css">
  
</head>

<body class="teacher-home-page">
  <div class="app-container">
        <header class="profile-header d-flex align-items-center justify-content-between">
            <h1 class="h6 fw-bold mb-0">Inicio</h1>
            <img class="school-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

    <main>
      <section class="greeting-card py-5" aria-labelledby="teacher-greeting">
        <h2 id="teacher-greeting">¡Hola, José Pérez!</h2>
        <p>¡Que tengas un excelente día!</p>
      </section>

      <nav class="action-grid py-3" aria-label="Accesos rápidos">
        <a href="verSolicitud.html" class="action-card">
          <div class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm1.8 12.1-4.5 4.5c-.2.2-.5.2-.7 0l-2.1-2.1c-.2-.2-.2-.5 0-.7l.7-.7c.2-.2.5-.2.7 0l1 1 3.8-3.8c.2-.2.5-.2.7 0l.7.7c.1.2.1.5-.1.7z"/></svg>
          </div>
          <span>Solicitudes</span>
        </a>

        <a href="Agenda.html" class="action-card">
          <div class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
          </div>
          <span>Mis Citas</span>
        </a>

        <a href="comunicados.html" class="action-card">
          <div class="icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20 2v3h2v2h-2v3h-2V2h2M4 9v6h3l5 5V4L7 9H4m11 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02Z"/></svg>
          </div>
          <span>Comunicados</span>
        </a>
      </nav>

      <section class="tasks-container" aria-labelledby="pending-tasks-title">
        <h2 class="tasks-title" id="pending-tasks-title">Actividades Pendientes</h2>
        <div class="tasks-card">
          <div class="task-item">
            <span>1- Tienes solicitudes pendientes</span>
            <a href="verSolicitud.html" class="btn-review text-decoration-none">Revisar</a>
          </div>
          <div class="task-item">
            <span>2- Confirmar cita para mañana</span>
            <a href="Agenda.html" class="btn-review text-decoration-none">Revisar</a>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <nav aria-label="Navegación principal">
        <ul class="bottom-nav">
          <li class="nav-item active">
            <a href="index.html" aria-label="Inicio" aria-current="page">
              <i class="bi bi-house-door-fill nav-icon" aria-hidden="true"></i>
            </a>
          </li>
          <li class="nav-item">
            <a href="Agenda.html" aria-label="Citas">
              <i class="bi bi-calendar3 nav-icon" aria-hidden="true"></i>
            </a>
          </li>
          <li class="nav-item">
            <a href="comunicados.html" aria-label="Comunicados">
              <i class="bi bi-megaphone-fill nav-icon" aria-hidden="true"></i>
            </a>
          </li>
          <li class="nav-item">
            <a href="perfil.html" aria-label="Usuario">
