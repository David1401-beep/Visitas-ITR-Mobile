<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicados - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="docentes-request-page communications-page" id="cuerpo-comunicados">

    <div class="app-container" id="contenedor-aplicacion">
        <header class="profile-header d-flex align-items-center justify-content-between" id="encabezado-principal">
            <h1 class="h6 fw-bold mb-0" id="titulo-encabezado">Comunicados</h1>
            <img class="school-logo" id="imagen-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="communications-content container-fluid" id="contenido-comunicados">
            <form class="communications-form" id="formulario-comunicados" action="#" method="post">
                <label class="visually-hidden" id="etiqueta-mensaje-comunicado" for="mensaje-comunicado">Contenido del comunicado</label>
                <textarea class="communications-textarea form-control" id="mensaje-comunicado"
                    name="communication_message" placeholder="Escribe un Aviso..." maxlength="250" required></textarea>

                <button id="btn-enviar-comunicado"
                    class="communications-submit btn btn-warning rounded-pill d-block mx-auto fw-bold" type="submit">
                    Enviar
                </button>
            </form>

            <!-- Los comunicados enviados se agregan aquí sin recargar la pantalla. -->
            <section class="communications-list" id="lista-comunicados" aria-label="Comunicados enviados"
                aria-live="polite"></section>
        </main>

        <footer id="pie-pagina">
            <nav id="navegacion-principal" aria-label="Navegación principal">
                <ul class="bottom-nav" id="lista-navegacion-inferior">
                    <li class="nav-item" id="item-nav-inicio">
                        <a id="enlace-nav-inicio" href="index.html" aria-label="Inicio">
                            <i class="bi bi-house-door-fill nav-icon" id="icono-nav-inicio" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-agenda">
                        <a id="enlace-nav-agenda" href="Agenda.html" aria-label="Citas">
                            <i class="bi bi-calendar3 nav-icon" id="icono-nav-agenda" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item active" id="item-nav-comunicados">
                        <a id="enlace-nav-comunicados" href="comunicados.html" aria-label="Notificaciones" aria-current="page">
                            <i class="bi bi-megaphone-fill nav-icon" id="icono-nav-comunicados" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-perfil">
                        <a id="enlace-nav-perfil" href="perfil.html" aria-label="Usuario">
                            <i class="bi bi-person-circle nav-icon" id="icono-nav-perfil" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>

    <script id="script-control-comunicados" src="../js/Docente/Controller/controlComunicados.js"></script>
</body>

</html>
