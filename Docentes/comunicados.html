<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicados - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="docentes-request-page communications-page">

    <div class="app-container">
        <header class="profile-header d-flex align-items-center justify-content-between">
            <h1 class="h6 fw-bold mb-0">Comunicados</h1>
            <img class="school-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="communications-content container-fluid">
            <form class="communications-form" id="communications-form" action="#" method="post">
                <label class="visually-hidden" for="communication-message">Contenido del comunicado</label>
                <textarea class="communications-textarea form-control" id="communication-message"
                    name="communication_message" placeholder="Escribe un Aviso..." maxlength="250" required></textarea>

                <button id="submit-btn"
                    class="communications-submit btn btn-warning rounded-pill d-block mx-auto fw-bold" type="submit">
                    Enviar
                </button>
            </form>

            <!-- Los comunicados enviados se agregan aquí sin recargar la pantalla. -->
            <section class="communications-list" id="communications-list" aria-label="Comunicados enviados"
                aria-live="polite"></section>
        </main>


        <footer>
            <nav aria-label="Navegación principal">
                <ul class="bottom-nav">
                    <li class="nav-item">
                        <a href="index.html" aria-label="Inicio">
                            <i class="bi bi-house-door-fill nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="Agenda.html" aria-label="Citas">
                            <i class="bi bi-calendar3 nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="comunicados.html" aria-label="Notificaciones" aria-current="page">
                            <i class="bi bi-megaphone-fill nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="perfil.html" aria-label="Usuario">
                            <i class="bi bi-person-circle nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>

    <script src="../js/Docente/Controller/controlComunicados.js"></script>
</body>

</html>
