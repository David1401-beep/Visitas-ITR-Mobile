<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Revisión de solicitud - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="review-request-page">
    <div class="app-container">
        <header class="review-header d-flex align-items-center justify-content-between">
            <div class="review-header-heading d-flex align-items-center">
                <a class="review-back-link" href="verSolicitud.html" aria-label="Regresar a solicitudes">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                </a>
                <span class="review-section-name fw-bold">Solicitudes</span>
            </div>

            <img class="school-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="review-content container-fluid">
            <h1 class="review-title fw-bold text-center">Revisión de Solicitud</h1>

            <article class="review-card" aria-labelledby="student-name">
                <h2 class="review-student fw-bold" id="student-name">Jholman Alegría</h2>

                <section class="review-details" aria-labelledby="request-details-title">
                    <h3 class="review-subtitle fw-bold" id="request-details-title">Detalles de la Solicitud</h3>

                    <p class="review-detail">
                        <strong>Motivo:</strong> Reunión Académica
                    </p>
                    <p class="review-detail review-description">
                        <strong>Descripción:</strong> Quisiera aclarar unas dudas con respecto a las notas de mi hijo
                    </p>
                </section>

                <form class="review-form" action="#" method="post">
                    <label class="review-comments-label fw-bold" for="review-comments">
                        Comentarios de la revisión
                    </label>
                    <textarea class="review-comments form-control" id="review-comments" name="review_comments"
                        placeholder="Realizar comentarios"></textarea>

                    <div class="review-actions d-flex align-items-center justify-content-around">
                        <button class="review-action review-accept btn rounded-pill fw-bold" type="button">
                            Aceptar
                        </button>
                        <button class="review-action review-reject btn rounded-pill fw-bold" type="button">
                            Rechazar
                        </button>
                    </div>
                </form>
            </article>
        </main>

        <footer>
            <nav aria-label="Navegación principal">
                <ul class="bottom-nav">
                    <li class="nav-item">
                        <a href="index.html" aria-label="Inicio">
                            <i class="bi bi-house-door-fill nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="Agenda.html" aria-label="Agenda" aria-current="location">
                            <i class="bi bi-calendar3 nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" aria-label="Comunicados">
                            <i class="bi bi-megaphone-fill nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" aria-label="Usuario">
                            <i class="bi bi-person-circle nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>
</body>

</html>
