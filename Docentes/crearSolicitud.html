<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Solicitud - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="docentes-request-page">
    
    <div class="app-container">
        <header class="home-header d-flex align-items-center justify-content-between">
            <h1 class="h6 fw-bold mb-0">Crear Solicitud</h1>
            <img class="school-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="request-content container-fluid">
            <form class="request-form needs-validation mx-auto" action="#" method="post" novalidate>

                <div class="request-field margin-dispersed">
                    <label class="form-label fw-bold ms-1 mb-1" for="visit-subject">Asunto</label>
                    <input type="text" class="request-control request-input-pill form-control" id="visit-subject" name="visit_subject"
                        placeholder="Asunto" required>
                </div>

                <div class="datetime-group-container margin-dispersed">
                    <div class="datetime-field-item">
                        <label class="datetime-label fw-bold ms-1 mb-1" for="visit-date">Fecha</label>
                        <div class="datetime-capsule" id="date-capsule" title="Seleccionar fecha">
                            <input class="datetime-native-input" type="date" id="visit-date" name="visit_date" value="2026-06-15" required>
                            <span class="datetime-value" id="date-display">15/6/2026</span>
                            <img src="../img/calendario.png" alt="Calendario" class="datetime-icon">
                        </div>
                    </div>

                    <div class="datetime-field-item">
                        <label class="datetime-label fw-bold ms-1 mb-1" for="visit-time">Hora</label>
                        <div class="datetime-capsule" id="time-capsule" title="Seleccionar hora">
                            <input class="datetime-native-input" type="time" id="visit-time" name="visit_time" value="10:30" required>
                            <span class="datetime-value" id="time-display">10:30 A.M</span>
                            <svg class="datetime-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="request-field margin-dispersed">
                    <label class="form-label fw-bold ms-1 mb-1" for="visit-description">Descripción de la convocatoria</label>
                    <textarea class="request-control request-description form-control" id="visit-description" name="visit_description"
                        placeholder="Mensaje" required></textarea>
                </div>

                <div class="request-field teacher-field margin-dispersed">
                    <label class="form-label fw-bold ms-1 mb-1" for="teacher">Estudiante</label>
                    <select class="request-control request-select form-select" id="teacher" name="teacher" required>
                        <option value="David Eduardo Ramírez Escobar">David Eduardo Ramírez Escobar</option>
                        <option value="Samuel Antonio Cabrera Molina">Samuel Antonio Cabrera Molina</option>
                        <option value="Jason Steven Miranda Navarrete">Jason Steven Miranda Navarrete</option>
                        <option value="Allan Adalberto Buendia Vasquez">Allan Adalberto Buendia Vasquez</option>
                        <option value="Raul Ernesto Mena Quito">Raul Ernesto Mena Quito</option>
                    </select>
                </div>

                <button id="submit-btn" class="request-submit btn btn-warning rounded-pill d-block mx-auto fw-bold" type="submit">
                    Enviar
                </button>
            </form>
        </main>

        <footer>
            <nav aria-label="Navegación principal">
                <ul class="bottom-nav">
                    <li class="nav-item">
                        <a href="dashboard.html" aria-label="Inicio">
                            <img src="../img/casa.png" alt="">
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="crearSolicitud.html" aria-label="Citas" aria-current="page">
                            <img src="../img/calendario.png" alt="">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" aria-label="Notificaciones">
                            <img src="../img/notificacion.png" alt="">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" aria-label="Usuario">
                            <img src="../img/usuario.png" alt="">
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>

    <div class="request-success-modal modal fade" id="requestSuccessModal" tabindex="-1"
        aria-labelledby="request-success-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body d-flex flex-column align-items-center text-center">
                    <h2 class="fw-bold" id="request-success-title">Solicitud Enviada Correctamente</h2>

                    <svg class="request-success-icon" viewBox="0 0 100 100" aria-hidden="true">
                        <circle cx="48" cy="52" r="34" fill="none" stroke="currentColor" stroke-width="6" />
                        <path d="M27 48 L47 68 L80 27" fill="none" stroke="currentColor" stroke-width="7"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>

                    <p class="request-success-message">
                        La solicitud ha sido enviada con éxito.<br>
                        Se le notificará sobre el estado de su solicitud.
                    </p>

                    <button class="request-modal-close btn btn-warning rounded-pill fw-bold" type="button"
                        data-bs-dismiss="modal">
                        Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../js/controlNavegacion.js"></script>
    <script src="../js/controlSolicitud.js"></script>
</body>
</html>
