<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Posponer solicitud - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
  <script type="module" src="../js/guardia.js"></script>

</head>

<body class="postpone-request-page" id="cuerpo-posponer-solicitud">
    <div class="app-container" id="contenedor-aplicacion">
        <header class="profile-header d-flex align-items-center justify-content-between" id="encabezado-principal">
            <h1 class="h6 fw-bold mb-0" id="titulo-encabezado">Posponer Solicitud</h1>
            <img class="school-logo" id="imagen-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>
        
        <main class="postpone-content container-fluid" id="contenido-posponer-solicitud">
            <form class="postpone-card" id="formulario-posponer-solicitud" action="#" method="post">
                <div class="postpone-field" id="campo-fecha-sugerida">
                    <label class="postpone-label" id="etiqueta-fecha-sugerida" for="fecha-sugerida">Nueva fecha sugerida</label>
                    <input class="postpone-control form-control" id="fecha-sugerida" name="suggested_date"
                        type="date" required>
                </div>

                <div class="postpone-field postpone-time-field" id="campo-hora-sugerida">
                    <label class="postpone-label" id="etiqueta-hora-sugerida" for="hora-sugerida">Nueva hora sugerida</label>
                    <input class="postpone-control form-control" id="hora-sugerida" name="suggested_time"
                        type="time" required>
                </div>

                <div class="postpone-field postpone-reason-field" id="campo-motivo-reprogramacion">
                    <label class="postpone-label" id="etiqueta-motivo-reprogramacion" for="motivo-reprogramacion">Motivo de la reprogramación</label>
                    <textarea class="postpone-control postpone-reason form-control" id="motivo-reprogramacion"
                        name="reschedule_reason" required></textarea>
                </div>

                <button class="postpone-submit btn btn-warning rounded-pill fw-bold" id="btn-enviar-propuesta" type="submit">
                    Enviar Propuesta
                </button>
            </form>
        </main>

        <!-- Panel de éxito -->
        <section class="postpone-success-panel" id="panel-exito-posponer" role="dialog" aria-modal="true"
            aria-labelledby="titulo-exito-posponer" hidden>
            <svg class="postpone-success-icon" id="icono-exito-posponer" viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="48" cy="52" r="34" fill="none" stroke="currentColor" stroke-width="6" />
                <path d="M27 48 L47 68 L80 27" fill="none" stroke="currentColor" stroke-width="7"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>

            <h2 class="postpone-success-title fw-bold" id="titulo-exito-posponer">
                Propuesta enviada<br>correctamente.
            </h2>

            <p class="postpone-success-message" id="mensaje-exito-posponer">
                Tu propuesta de reprogramación<br>
                ha sido enviada con éxito al<br>
                solicitante.
            </p>

            <div class="postpone-success-details" id="detalles-exito-posponer">
                <h3 class="fw-bold" id="titulo-detalles-exito">Detalles de la propuesta:</h3>
                <p id="parrafo-fecha-exito"><strong>Nueva Fecha:</strong> <span id="fecha-exito-posponer"></span></p>
                <p id="parrafo-hora-exito"><strong>Nueva Hora:</strong> <span id="hora-exito-posponer"></span></p>
            </div>

            <button class="postpone-success-close btn btn-warning rounded-pill fw-bold" id="btn-cerrar-exito-posponer"
                type="button">
                Cerrar
            </button>
        </section>

        <footer id="pie-pagina">
            <nav id="navegacion-principal" aria-label="Navegación principal">
                <ul class="bottom-nav" id="lista-navegacion-inferior">
                    <li class="nav-item" id="item-nav-inicio">
                        <a id="enlace-nav-inicio" href="index.html" aria-label="Inicio">
                            <i class="bi bi-house-door-fill nav-icon" id="icono-nav-inicio" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item active" id="item-nav-agenda">
                        <a id="enlace-nav-agenda" href="Agenda.html" aria-label="Citas" aria-current="location">
                            <i class="bi bi-calendar3 nav-icon" id="icono-nav-agenda" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-comunicados">
                        <a id="enlace-nav-comunicados" href="comunicados.html" aria-label="Comunicados">
                            <i class="bi bi-megaphone-fill nav-icon" id="icono-nav-comunicados" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-perfil">
                        <a id="enlace-nav-perfil" href="perfil.html" aria-label="Usuario">
                            <i class="bi bi-person-circle nav-icon" id="icono-nav-perfil" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>

    <script id="script-control-posponer-solicitud" src="../js/Docente/Controller/controlPosponerSolicitud.js"></script>
</body>

</html>
