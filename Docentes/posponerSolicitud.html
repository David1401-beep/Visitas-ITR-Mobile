<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Posponer solicitud - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="postpone-request-page">
    <div class="app-container">
        <header class="profile-header d-flex align-items-center justify-content-between">
            <h1 class="h6 fw-bold mb-0">Posponer Solicitud</h1>
            <img class="school-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>
        
        <main class="postpone-content container-fluid">
            <form class="postpone-card" action="#" method="post">
                <div class="postpone-field">
                    <label class="postpone-label" for="postpone-date">Nueva fecha sugerida</label>
                    <input class="postpone-control form-control" id="postpone-date" name="suggested_date"
                        type="date" required>
                </div>

                <div class="postpone-field postpone-time-field">
                    <label class="postpone-label" for="postpone-time">Nueva hora sugerida</label>
                    <input class="postpone-control form-control" id="postpone-time" name="suggested_time"
                        type="time" required>
                </div>

                <div class="postpone-field postpone-reason-field">
                    <label class="postpone-label" for="postpone-reason">Motivo de la reprogramación</label>
                    <textarea class="postpone-control postpone-reason form-control" id="postpone-reason"
                        name="reschedule_reason" required></textarea>
                </div>

                <button class="postpone-submit btn btn-warning rounded-pill fw-bold" type="submit">
                    Enviar Propuesta
                </button>
            </form>
        </main>

        <section class="postpone-success-panel" id="postpone-success-panel" role="dialog" aria-modal="true"
            aria-labelledby="postpone-success-title" hidden>
            <svg class="postpone-success-icon" viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="48" cy="52" r="34" fill="none" stroke="currentColor" stroke-width="6" />
                <path d="M27 48 L47 68 L80 27" fill="none" stroke="currentColor" stroke-width="7"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>

            <h2 class="postpone-success-title fw-bold" id="postpone-success-title">
                Propuesta enviada<br>correctamente.
            </h2>

            <p class="postpone-success-message">
                Tu propuesta de reprogramación<br>
                ha sido enviada con éxito al<br>
                solicitante.
            </p>

            <div class="postpone-success-details">
                <h3 class="fw-bold">Detalles de la propuesta:</h3>
                <p><strong>Nueva Fecha:</strong> <span id="postpone-success-date"></span></p>
                <p><strong>Nueva Hora:</strong> <span id="postpone-success-time"></span></p>
            </div>

            <button class="postpone-success-close btn btn-warning rounded-pill fw-bold" id="postpone-success-close"
                type="button">
                Cerrar
            </button>
        </section>

        <footer>
            <nav aria-label="Navegación principal">
                <ul class="bottom-nav">
                    <li class="nav-item">
                        <a href="index.html" aria-label="Inicio">
                            <i class="bi bi-house-door-fill nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="Agenda.html" aria-label="Citas" aria-current="location">
                            <i class="bi bi-calendar3 nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="comunicados.html" aria-label="Comunicados">
                            <i class="bi bi-megaphone-fill nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="perfil.html" aria-label="Usuario">
                            <i class="bi bi-person-circle nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>

    <script src="../js/Docente/Controller/controlPosponerSolicitud.js"></script>
</body>

</html>
