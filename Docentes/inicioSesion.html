<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page" id="cuerpo-inicio-sesion">
    <div class="app-container" id="contenedor-aplicacion">
        <main class="login-content container-fluid d-flex flex-column align-items-center justify-content-center" id="contenido-inicio-sesion">
            <img src="../img/logoRicaldone.png" alt="Salesianos Ricaldone" class="logo-small" id="imagen-logo-login">

            <h2 class="login-title" id="titulo-inicio-sesion">Iniciar Sesión</h2>

            <form action="index.html" class="login-form" id="formulario-inicio-sesion">
                <input type="email" class="custom-input" id="correo-usuario" placeholder="Correo" required aria-label="Correo">
                
                <div class="password-wrapper" id="contenedor-contrasena">
                    <input type="password" id="contrasena-usuario" class="custom-input" placeholder="Contraseña" required aria-label="Contraseña">
                </div>

                <button type="submit" class="btn-yellow" id="btn-iniciar-sesion">Iniciar</button>
            </form>
        </main>
    </div>

    <script id="script-control-sesion" src="../js/Docente/Controller/controlSesion.js"></script>
</body>
</html>
