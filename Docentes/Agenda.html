<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agenda - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="agenda-page">
    <div class="app-container">

        <header class="agenda-header d-flex align-items-center justify-content-between">
            <h1 class="h6 fw-bold mb-0">Agenda</h1>

            <img class="school-logo" src="img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="agenda-content container-fluid">
            <div class="agenda-list">

                <section class="agenda-card card border-0">
                    <div class="card-body">
                        <h2 class="agenda-date fw-bold">
                            20 de Septiembre
                        </h2>

                        <p class="agenda-event">
                            <strong>2:00 P.M</strong>
                            <span>– Escuela de padres</span>
                        </p>

                        <p class="agenda-event mb-0">
                            <strong>3:30 P.M</strong>
                            <span>– Charla</span>
                        </p>
                    </div>
                </section>

                <section class="agenda-card card border-0">
                    <div class="card-body">
                        <h2 class="agenda-date fw-bold">
                            22 de Agosto
                        </h2>

                        <p class="agenda-event">
                            <strong>2:00 P.M</strong>
                            <span>– Reunión de padres</span>
                        </p>

                        <p class="agenda-event mb-0">
                            <strong>3:30 P.M</strong>
                            <span>– Tutoría</span>
                        </p>
                    </div>
                </section>

            </div>

            <div class="agenda-actions d-flex flex-column align-items-center">
                <a class="agenda-button btn rounded-pill fw-bold" href="#" role="button">
                    Ver Solicitudes
                </a>

                <a class="agenda-button btn rounded-pill fw-bold" href="CrearSolicitud.html" role="button">
                    Realizar Cita
                </a>
            </div>
        </main>

    </div>
    <script src="../js/controlNavegacion.js"></script>
</body>

</html>
