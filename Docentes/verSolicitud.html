<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solicitudes - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="request-list-page" id="cuerpo-lista-solicitudes">
    <div class="app-container" id="contenedor-aplicacion">
        <header class="profile-header d-flex align-items-center justify-content-between" id="encabezado-principal">
            <h1 class="h6 fw-bold mb-0" id="titulo-encabezado">Ver Solicitudes</h1>
            <img class="school-logo" id="imagen-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="request-list-content container-fluid" id="contenido-lista-solicitudes">
            <section class="request-list" id="seccion-lista-solicitudes" aria-label="Solicitudes pendientes">
                <article class="request-summary-card" id="tarjeta-solicitud-1">
                    <h2 class="request-summary-student fw-bold" id="nombre-solicitante-1">Jholman Alegría</h2>

                    <dl class="request-summary-details" id="detalles-solicitud-1">
                        <div id="contenedor-motivo-1">
                            <dt id="etiqueta-motivo-1">Motivo:</dt>
                            <dd id="motivo-solicitud-1">Reunión Académica</dd>
                        </div>
                        <div id="contenedor-fecha-1">
                            <dt id="etiqueta-fecha-1">Fecha:</dt>
                            <dd id="fecha-solicitud-1">10/5/2026</dd>
                        </div>
                        <div id="contenedor-hora-1">
                            <dt id="etiqueta-hora-1">Hora:</dt>
                            <dd id="hora-solicitud-1">9:00 A.M</dd>
                        </div>
                    </dl>

                    <div class="request-summary-actions" id="acciones-solicitud-1">
                        <a class="request-list-action request-list-review" id="btn-revisar-solicitud-1"
                            href="revisarSolicitud.html?solicitud=1&amp;nombre=Jholman%20Alegr%C3%ADa&amp;motivo=Reuni%C3%B3n%20Acad%C3%A9mica&amp;descripcion=Quisiera%20aclarar%20unas%20dudas%20con%20respecto%20a%20las%20notas%20de%20mi%20hijo">
                            Revisar
                        </a>
                        <a class="request-list-action request-list-postpone" id="btn-posponer-solicitud-1"
                            href="posponerSolicitud.html?solicitud=1&amp;nombre=Jholman%20Alegr%C3%ADa">
                            Posponer
                        </a>
                    </div>
                </article>

                <article class="request-summary-card" id="tarjeta-solicitud-2">
                    <h2 class="request-summary-student fw-bold" id="nombre-solicitante-2">David Ramírez</h2>

                    <dl class="request-summary-details" id="detalles-solicitud-2">
                        <div id="contenedor-motivo-2">
                            <dt id="etiqueta-motivo-2">Motivo:</dt>
                            <dd id="motivo-solicitud-2">Aclarar dudas</dd>
                        </div>
                        <div id="contenedor-fecha-2">
                            <dt id="etiqueta-fecha-2">Fecha:</dt>
                            <dd id="fecha-solicitud-2">11/5/2026</dd>
                        </div>
                        <div id="contenedor-hora-2">
                            <dt id="etiqueta-hora-2">Hora:</dt>
                            <dd id="hora-solicitud-2">10:00 A.M</dd>
                        </div>
                    </dl>

                    <div class="request-summary-actions" id="acciones-solicitud-2">
                        <a class="request-list-action request-list-review" id="btn-revisar-solicitud-2"
                            href="revisarSolicitud.html?solicitud=2&amp;nombre=David%20Ram%C3%ADrez&amp;motivo=Aclarar%20dudas&amp;descripcion=Reuni%C3%B3n%20para%20aclarar%20dudas%20acad%C3%A9micas">
                            Revisar
                        </a>
                        <a class="request-list-action request-list-postpone" id="btn-posponer-solicitud-2"
                            href="posponerSolicitud.html?solicitud=2&amp;nombre=David%20Ram%C3%ADrez">
                            Posponer
                        </a>
                    </div>
                </article>
            </section>
        </main>

        <footer id="pie-pagina">
            <nav id="navegacion-principal" aria-label="Navegación principal">
                <ul class="bottom-nav" id="lista-navegacion-inferior">
                    <li class="nav-item" id="item-nav-inicio">
                        <a id="enlace-nav-inicio" href="index.html" aria-label="Inicio">
                            <i class="bi bi-house-door-fill nav-icon" id="icono-nav-inicio" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item active" id="item-nav-agenda">
                        <a id="enlace-nav-agenda" href="Agenda.html" aria-label="Agenda" aria-current="location">
                            <i class="bi bi-calendar3 nav-icon" id="icono-nav-agenda" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-comunicados">
                        <a id="enlace-nav-comunicados" href="comunicados.html" aria-label="Comunicados">
                            <i class="bi bi-megaphone-fill nav-icon" id="icono-nav-comunicados" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-perfil">
                        <a id="enlace-nav-perfil" href="perfil.html" aria-label="Usuario">
                            <i class="bi bi-person-circle nav-icon" id="icono-nav-perfil" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>
</body>

</html>
