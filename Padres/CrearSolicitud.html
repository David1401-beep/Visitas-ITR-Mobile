<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear solicitud - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="request-page">
    <div class="app-container">
        <header class="home-header d-flex align-items-center justify-content-between">
            <h1 class="h6 fw-bold mb-0">Crear solicitud</h1>
            <img class="school-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="request-content container-fluid">
            <form class="request-form needs-validation mx-auto" action="#" method="post" novalidate>
                <div class="request-field guardian-field">
                    <label class="form-label" for="guardian">Encargado</label>
                    <select class="request-control request-select form-select" id="guardian" name="guardian" required>
                        <option value="Madre">Madre</option>
                        <option value="Padre">Padre</option>
                        <option value="Otro">Otro encargado</option>
                    </select>
                </div>

                <div class="request-field teacher-field">
                    <label class="form-label" for="teacher">Docente</label>
                    <select class="request-control request-select form-select" id="teacher" name="teacher" required>
                        <option value="Prof. Ricardo De Paz">Prof. Ricardo De Paz</option>
                        <option value="Prof. Josue Guinea">Prof. Josue Guinea</option>
                        <option value="Dra. Maria Rodriguez">Dra. Maria Rodriguez</option>
                    </select>
                </div>

                <div class="request-field date-field">
                    <label class="form-label" for="visit-date">Fecha</label>
                    <input class="request-control request-date form-control" type="date" id="visit-date"
                        name="visit_date" required>
                </div>

                <div class="request-field reason-field">
                    <label class="visually-hidden" for="visit-reason">Motivo de la visita</label>
                    <textarea class="request-control request-reason form-control" id="visit-reason" name="visit_reason"
                        placeholder="Motivo de la Visita" required></textarea>
                </div>

                <button id="submit-btn" class="request-submit btn btn-warning rounded-pill d-block mx-auto fw-bold" type="submit">
                    Enviar solicitud
                </button>
            </form>
        </main>

        <footer>
            <nav aria-label="Navegación principal">
                <ul class="bottom-nav">
                    <li class="nav-item">
                        <a href="index.html" aria-label="Inicio">
                            <i class="bi bi-house-door-fill nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="Citas.html" aria-label="Citas" aria-current="page">
                            <i class="bi bi-calendar3 nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="notificaciones.html" aria-label="Notificaciones">
                            <i class="bi bi-bell-fill nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="perfil.html" aria-label="Usuario">
                            <i class="bi bi-person-circle nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>

    <div class="request-success-modal modal fade" id="requestSuccessModal" tabindex="-1"
        aria-labelledby="request-success-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body d-flex flex-column align-items-center text-center">
                    <h2 class="fw-bold" id="request-success-title">Solicitud Enviada Correctamente</h2>

                    <svg class="request-success-icon" viewBox="0 0 100 100" aria-hidden="true">
                        <circle cx="48" cy="52" r="34" fill="none" stroke="currentColor" stroke-width="6" />
                        <path d="M27 48 L47 68 L80 27" fill="none" stroke="currentColor" stroke-width="7"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>

                    <p class="request-success-message">
                        La solicitud ha sido enviada con éxito al docente.<br>
                        Se le notificará sobre el estado de su solicitud.
                    </p>

                    <button class="request-modal-close btn btn-warning rounded-pill fw-bold" type="button"
                        data-bs-dismiss="modal">
                        Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../js/Padre/Controller/controlNavegacion.js"></script>
    <script src="../js/Padre/Controller/controlSolicitud.js"></script>
</body>

</html>
