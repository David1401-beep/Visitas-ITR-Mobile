<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Visitas ITR</title>
    <link rel="shortcut icon" href="img/logoRicaldone.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <header class="home-header d-flex align-items-center justify-content-between">
            <h1 class="h6 fw-bold mb-0">Inicio</h1>
            <img class="school-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="home-content container-fluid d-flex flex-column align-items-center">
            <section class="home-card appointment-card card border-0 text-center"
                aria-labelledby="pending-appointment-title">
                <div class="card-body d-flex flex-column align-items-center w-100">
                    <h2 id="pending-appointment-title" class="card-title fs-6 fw-bold mb-0">
                        Tienes una cita pendiente:
                    </h2>
                    <p class="appointment-description mb-0">
                        Oprime el botón amarillo<br>
                        que está abajo.
                    </p>
                    <a class="appointment-link btn btn-warning rounded-pill fw-bold" href="Citas.html" role="button">
                        Ver mis citas
                    </a>
                </div>
            </section>

            <section class="home-card notices-card card border-0 text-center" aria-labelledby="notices-title">
                <div class="card-body w-100">
                    <h2 id="notices-title" class="card-title fs-6 fw-bold">¡Avisos Importantes!</h2>
                    <p>
                        Reunion General Día<br>
                        20 de Junio a las<br>
                        8:00 A.M.
                    </p>
                    <p class="mb-0">
                        Reunion General Día<br>
                        15 de Septiembre a las<br>
                        2:00 P.M.
                    </p>
                </div>
            </section>
        </main>

        <footer>
            <nav aria-label="Navegación principal">
                <ul class="bottom-nav">
                    <li class="nav-item active">
                        <a href="index.html" aria-label="Inicio" aria-current="page">
                            <img src="img/casa.png" alt="">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/Padres/Citas.html" aria-label="Citas">
                            <img src="img/calendario.png" alt="">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/Padres/notificaciones.html" aria-label="Notificaciones">
                            <img src="img/notificacion.png" alt="">
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/Padres/perfil.html" aria-label="Usuario">
                            <img src="img/usuario.png" alt="">
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>

    <script src="js/controlNavegacion.js"></script>
</body>

</html>
