<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Document</title>
    <link rel="shortcut icon" href="./img/logoRicaldone.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Fondo oscuro para la pantalla de tu computadora, para que resalte la "app" */
        body {
            background-color: #2d313a;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor principal que actúa como la pantalla del celular */
        .app-container {
            width: 100%;
            max-width: 414px;
            /* Ancho típico de un teléfono grande */
            height: 100vh;
            max-height: 896px;
            /* Altura máxima para que no se estire infinito en PC */
            background-color: var(--pico-background-color);
            /* Respeta el modo oscuro/claro de PicoCSS */
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            /* Sombra para efecto 3D en PC */
            position: relative;
            overflow: hidden;
        }

        /* Encabezado superior de la App (Top Bar) */
        .app-container header {
            padding: 1rem;
            border-bottom: 1px solid var(--pico-muted-border-color);
            text-align: center;
            background-color: var(--pico-card-background-color);
            z-index: 10;
        }

        .app-container header h1 {
            margin: 0;
            font-size: 1.2rem;
        }

        /* Contenedor scrolleable (donde van tus vistas) */
        .app-container main {
            flex: 1;
            /* Toma todo el espacio disponible entre el header y el footer */
            overflow-y: auto;
            /* Permite scroll vertical */
            padding: 1rem;
        }
    </style>
</head>

<body>

    <div class="app-container">

        <main>


        </main>

        <footer>
            <ul class="bottom-nav">
                <li class="nav-item active"><a href="#"><img src="img/casa.png" alt="Inicio"></a></li>
                <li class="nav-item"><a href="#"><img src="img/calendario.png" alt="Calendario"></a></li>
                <li class="nav-item"><a href="#"><img src="img/notificacion.png" alt="Notificaciones"></a></li>
                <li class="nav-item"><a href="#"><img src="img/usuario.png" alt="Usuario"></a></li>
            </ul>
        </footer>

    </div>

    <script src="js/controlNavegacion.js"></script>
</body>

</html>
